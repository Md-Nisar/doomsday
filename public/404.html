<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Page not found — Avengers: Doomsday</title>

    <!--
      GitHub Pages' static file server has no route table of its own, so it
      serves this file (with a real HTTP 404 status) for ANY path that isn't
      a physical file — including perfectly valid in-app routes like
      /news/some-slug, on a hard navigation or refresh. This script does not
      decide whether the requested path is valid; it just hands the exact
      requested path back to the real app so React Router can decide. It
      stores the path in sessionStorage (survives the navigation below, does
      not touch server state or history) and replaces this document with the
      real app at "/". index.html's own small script reads that value back
      and restores the URL before React mounts — see the matching comment
      there. If JS is unavailable, none of this runs and the plain branded
      page below is what the visitor sees.
    -->
    <script>
      (function () {
        var requested = location.pathname + location.search + location.hash
        if (requested === '/') return
        try {
          sessionStorage.setItem('spa-redirect-path', requested)
        } catch (e) {
          return
        }
        location.replace('/')
      })()
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        color-scheme: dark;
        --color-bg: #08090b;
        --color-text-primary: #f5f6f8;
        --color-text-muted: #9ba1ac;
        --color-accent: #35d98f;
        --color-accent-solid: #0e7a4c;
        --color-accent-foreground: #f5fff9;
        --color-border: rgba(255, 255, 255, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--color-bg);
        color: var(--color-text-primary);
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        text-align: center;
      }

      main {
        max-width: 28rem;
      }

      .eyebrow {
        font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 0.75rem;
        color: var(--color-accent);
        margin: 0 0 1rem;
      }

      h1 {
        font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
        font-weight: 700;
        font-size: clamp(2rem, 1.6rem + 2vw, 3rem);
        line-height: 1.1;
        margin: 0 0 0.75rem;
      }

      p {
        color: var(--color-text-muted);
        line-height: 1.6;
        margin: 0 0 2rem;
      }

      a.home-link {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        border-radius: 999px;
        background: var(--color-accent-solid);
        color: var(--color-accent-foreground);
        text-decoration: none;
        font-weight: 500;
        border: 1px solid var(--color-border);
      }

      a.home-link:focus-visible {
        outline: 2px solid var(--color-accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Avengers: Doomsday</p>
      <h1>Page not found</h1>
      <p>
        This page doesn't exist yet, or it moved. Head back to the countdown.
      </p>
      <a class="home-link" href="/">Back to Avengers: Doomsday</a>
    </main>
  </body>
</html>
